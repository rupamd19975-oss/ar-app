<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no;" vr-mode-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      // WAIT FOR LOAD
      window.addEventListener('load', () => {
        const target = document.querySelector('#target');
        target.addEventListener("targetFound", () => {
            // === PASTE YOUR LINK BELOW ===
            window.location.href = "https://www.youtube.com/watch?v=EtpNnE-VOGY";
            // =============================
        });
      });
    </script>
</body>
</html>
