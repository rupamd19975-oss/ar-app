<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style> body { margin: 0; overflow: hidden; background: #000; } </style>
</head>
<body>
    <script>
        const PASS = "1234";
        window.addEventListener('load', () => {
            if (prompt("Password:") !== PASS) { window.location.href = "https://google.com"; }
        });
    </script>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no;" vr-mode-ui="enabled: false">
        <a-assets>
            <video id="myVideo" src="./clip.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <a-video src="#myVideo" width="1" height="0.6" position="0 0 0.1"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector("#myVideo");
        const target = document.querySelector("#target");
        target.addEventListener("targetFound", () => { video.play(); });
        target.addEventListener("targetLost", () => { video.pause(); });
    </script>
</body>
</html>
